name: csARM content

# Fetches CS:GO legacy (1.38.8.1) game content straight from the Steam CDNs
# with DepotDownloader (anonymous login) on the runner's fat pipe, then
# attaches it to the DRAFT release 'game-content', which .github/workflows/
# ci.yml boot-test consumes automatically (download -> run-as -> filesDir).
#
# Candidate sources, first anonymous success wins (probed via steam.inf):
#   1. app 4465480        — CS:GO Legacy standalone client app
#   2. app 730 csgo_legacy — legacy branch of the main app
#   3. app 740            — dedicated server (client content minus UI extras)
#
# Packs (per A/B convention):
#   A-pack (default): everything EXCEPT pak01_*.vpk and any bin/ dir
#                     -> files/cstrike/{cstrike,platform,panorama?,...}
#   B-pack (input include_pak01=true): only pak01_*.vpk
#                     -> files/cstrike/pak01_*.vpk (mounted by gameinfo)
# DepotDownloader 2.7.4 filelists are inclusion-only, so the A-filter is a
# single negative-lookahead regex instead of '.*' + '!exclusions'.
#
# Manual trigger only. Assets are named apart-NN.zip / bpart-NN.zip and are
# capped at 1.6 GiB (GitHub asset hard limit is 2 GiB).

on:
  workflow_dispatch:
    inputs:
      include_pak01:
        description: 'true = B-pack (pak01_*.vpk only)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: content-fetch
  cancel-in-progress: false

jobs:
  fetch:
    name: fetch/steam-legacy-depots
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Install DepotDownloader
        run: |
          set -e
          curl -sfL --retry 3 -o dd.zip https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_2.7.4/DepotDownloader-linux-x64.zip
          unzip -q -o dd.zip && chmod +x DepotDownloader
          ./DepotDownloader 2>&1 | head -3 || true
          echo "--- disk ---"; df -h /

      # Anonymous access probe per candidate: fetch only steam.inf, print the
      # version, stop at the first candidate that works. Access-denied fails
      # within seconds, so a full sweep costs ~1-2 min.
      - name: Probe anonymous access (steam.inf, verify 1.38.8.1)
        id: probe
        run: |
          set -e
          printf 'regex:(^|/)steam\\.inf$\n' > fl_probe.txt
          PICKED=""
          try() {
            local app="$1" br="$2" dir="probe_$1"
            rm -rf "$dir" && mkdir -p "$dir"
            local args=(-app "$app" -os windows -username anonymous -filelist fl_probe.txt -dir "$dir")
            [ -n "$br" ] && args+=(-branch "$br")
            echo "::group::probe app=$app branch=${br:-public}"
            timeout 180 ./DepotDownloader "${args[@]}" > "probe_$1.log" 2>&1 || true
            tail -12 "probe_$1.log"
            local inf
            inf=$(find "$dir" -name steam.inf | head -1)
            if [ -n "$inf" ]; then
              echo "--- steam.inf ($inf) ---"; cat "$inf"
              if grep -q "PatchVersion=1.38.8.1" "$inf"; then
                PICKED="$app|$br"
                echo "PICKED=$PICKED" >> "$GITHUB_OUTPUT"
                echo "::notice::candidate app=$app branch=${br:-public} accepted"
              else
                echo "::warning::app=$app version mismatch (not 1.38.8.1)"
              fi
            else
              echo "::warning::app=$app branch=${br:-public}: no steam.inf fetched"
            fi
            echo "::endgroup::"
          }
          try 4465480 ""
          [ -n "$PICKED" ] || try 730 "csgo_legacy"
          [ -n "$PICKED" ] || try 740 ""
          [ -n "$PICKED" ] || { echo "::error::all anonymous candidates failed"; exit 1; }

      - name: Download pack (filtered by regex filelist)
        env:
          INCLUDE_PAK01: ${{ inputs.include_pak01 }}
        run: |
          set -e
          IFS='|' read -r APP BR <<< "${{ steps.probe.outputs.PICKED }}"
          if [ "$INCLUDE_PAK01" = "true" ]; then
            printf 'regex:pak01_\n' > fl.txt
            echo "PREFIX=bpart" >> "$GITHUB_ENV"
          else
            printf 'regex:^(?!.*pak01_.*)(?!.*(^|/)bin(/|$)).*\n' > fl.txt
            echo "PREFIX=apart" >> "$GITHUB_ENV"
          fi
          rm -rf content && mkdir -p content
          ARGS=(-app "$APP" -os windows -username anonymous -filelist fl.txt \
                -dir content -max-downloads 16)
          [ -n "$BR" ] && ARGS+=(-branch "$BR")
          echo "downloading app=$APP branch=${BR:-public} pak01=${INCLUDE_PAK01}"
          time ./DepotDownloader "${ARGS[@]}" 2>&1 | tee dl.log | tail -20
          echo "--- disk after download ---"; df -h /
          echo "--- depot root ---"; ls content | head -30
          echo "--- counts ---"; echo "files: $(find content -type f | wc -l)  size: $(du -sh content | cut -f1)"
          [ -d content/cstrike ] || [ -d content/csgo/cstrike ] || { echo "::error::unexpected depot layout (no cstrike/)"; find content -maxdepth 2 | head -30; exit 1; }

      - name: Split into release-sized parts
        run: |
          set -e
          python3 scripts/split_parts.py content 1600000000 /tmp/chunks
          mkdir -p parts
          n=0
          for lst in /tmp/chunks/chunk_*.lst; do
            n=$((n+1))
            name="$PREFIX-$(printf '%02d' "$n")"
            (cd content && zip -q -X -1 "../parts/$name.zip" -@ < "$lst")
          done
          echo "--- parts ---"; ls -la parts/
          df -h /

      - name: Refresh + upload to draft release game-content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # drop stale parts of the SAME prefix only (a B-pack run must not
          # delete the A-pack and vice versa); --clobber refreshes the rest
          gh release view game-content --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -E "^${PREFIX}-" | while read -r a; do
              gh release delete-asset game-content "$a" --repo "$GITHUB_REPOSITORY" --yes || true
            done
          gh release upload game-content parts/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          echo "--- draft release assets now ---"
          gh release view game-content --repo "$GITHUB_REPOSITORY" \
            --jq '.assets[] | .name + "  " + ((.size / 1073741824 * 100 | round) / 100 | tostring) + "GB"'

      - name: Summary
        if: always()
        run: |
          echo "probe:    ${{ steps.probe.outputs.PICKED || 'none' }}"
          echo "prefix:   ${PREFIX:-n/a}"
          echo "dl.log tail:"; tail -20 dl.log 2>/dev/null || true
