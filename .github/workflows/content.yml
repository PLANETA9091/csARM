name: csARM content

# Fetches CS:GO legacy (1.38.8.1) game content straight from the Steam CDNs
# with DepotDownloader (anonymous login) on the runner's fat pipe, then
# attaches it to the DRAFT release 'game-content', which ci.yml boot-test
# consumes automatically (download -> run-as -> filesDir).
#
# v3: speed + visibility overhaul
#   - TWO parallel runners (matrix): pack A = everything except pak01_/bin/,
#     pack B = pak01_*.vpk only. Two runner IPs -> double Steam CDN bandwidth.
#   - DepotDownloader -max-servers 64 -max-downloads 32 (defaults are 20/8).
#   - LIVE logs: DD output goes to dd.log; a heartbeat prints every 20 s into
#     this step's log (total MiB, file count, MiB/s, last real DD lines).
#     Watch it live in the Actions tab while the job runs.
#   - Hardcoded app 730 / -branch csgo_legacy: verified anonymously reachable,
#     manifest = 1.38.8.1 (steam.inf PatchVersion, Oct 12 2023).
#   - Version gate: refuses to upload if steam.inf is not 1.38.8.1.
#   - Layout normalized to a top-level cstrike/ dir for ci.yml.
#
# Assets: apart-NN.zip / bpart-NN.zip, each <= 1.6 GiB (GitHub limit is 2 GiB).

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: content-fetch
  cancel-in-progress: true

jobs:
  fetch:
    name: fetch/${{ matrix.prefix }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - pack: A (all content except pak01_/bin/)
            filelist: 'regex:^(?!.*pak01_.*)(?!.*(^|/)bin(/|$)).*'
            prefix: apart
            check_inf: true
          - pack: B (pak01 vpk only)
            filelist: 'regex:pak01_'
            prefix: bpart
            check_inf: false
    env:
      PREFIX: ${{ matrix.prefix }}
      FILELIST: ${{ matrix.filelist }}
      CHECK_INF: ${{ matrix.check_inf }}
    steps:
      - uses: actions/checkout@v4

      - name: Install DepotDownloader
        run: |
          set -e
          curl -sfL --retry 3 -o dd.zip https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_2.7.4/DepotDownloader-linux-x64.zip
          unzip -q -o dd.zip && chmod +x DepotDownloader
          ./DepotDownloader 2>&1 | head -3 || true
          echo "--- disk ---"; df -h /

      - name: Download pack (max concurrency, LIVE heartbeat)
        run: |
          set -e
          printf '%s\n' "$FILELIST" > fl.txt
          rm -rf content && mkdir -p content
          ARGS=(-app 730 -os windows -branch csgo_legacy -filelist fl.txt \
                -dir content -max-servers 64 -max-downloads 32)
          echo "DD args: ${ARGS[*]}"
          echo "LIVE progress: one heartbeat line every 20 s"
          ./DepotDownloader "${ARGS[@]}" > dd.log 2>&1 &
          DD_PID=$!
          T0=$(date +%s); LAST=0
          while kill -0 "$DD_PID" 2>/dev/null; do
            sleep 20
            NOW=$(date +%s); DT=$((NOW - T0))
            SZ=$(du -sm content 2>/dev/null | cut -f1); SZ=${SZ:-0}
            NF=$(find content -type f 2>/dev/null | wc -l)
            RATE=$(( (SZ - LAST) / 20 ))
            echo "[hb $(date -u +%H:%M:%S)] total=${SZ}MiB files=${NF} rate=${RATE}MiB/s elapsed=${DT}s"
            LAST=$SZ
            tail -c 3000 dd.log | tr '\r' '\n' | grep -v '^[[:space:]]*$' | tail -3 | sed 's/^/  [dd] /'
          done
          set +e; wait "$DD_PID"; RC=$?; set -e
          echo "=== DepotDownloader exit=$RC after $(( $(date +%s) - T0 ))s ==="
          tail -c 12000 dd.log | tr '\r' '\n' | grep -v '^[[:space:]]*$' | tail -50 || true
          [ "$RC" = "0" ] || { echo "::error::DepotDownloader failed rc=$RC"; exit "$RC"; }
          echo "--- counts ---"
          echo "files: $(find content -type f | wc -l)  size: $(du -sh content | cut -f1)"
          df -h /

      - name: Verify version + normalize layout
        run: |
          set -e
          inf=$(find content -name steam.inf | head -1)
          if [ -n "$inf" ]; then
            echo "--- $inf ---"; cat "$inf"
            grep -q 'PatchVersion=1.38.8.1' "$inf" \
              || { echo "::error::content is NOT legacy 1.38.8.1 (wrong branch?)"; exit 1; }
            echo "::notice::steam.inf confirms 1.38.8.1 (csgo_legacy)"
          elif [ "$CHECK_INF" = "true" ]; then
            echo "::error::pack A missing steam.inf"; exit 1
          fi
          if [ ! -d content/cstrike ]; then
            if [ -d content/csgo/cstrike ]; then
              mv content/csgo/cstrike content/cstrike
              echo "normalized: content/csgo/cstrike -> content/cstrike"
            elif [ -d content/csgo ]; then
              mv content/csgo content/cstrike
              echo "normalized: content/csgo -> content/cstrike"
            fi
          fi
          echo "--- layout ---"; find content -maxdepth 2 -type d | head -20
          ls content/cstrike | head -25 || true

      - name: Split into release-sized parts
        run: |
          set -e
          python3 scripts/split_parts.py content 1600000000 /tmp/chunks
          mkdir -p parts
          n=0
          for lst in /tmp/chunks/chunk_*.lst; do
            n=$((n+1))
            name="$PREFIX-$(printf '%02d' "$n")"
            (cd content && zip -q -X -1 "../parts/$name.zip" -@ < "$lst")
            echo "zipped parts/$name.zip ($(du -m "parts/$name.zip" | cut -f1) MiB)"
          done
          echo "--- parts ---"; ls -la parts/
          df -h /

      - name: Refresh + upload to draft release game-content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # drop stale parts of the SAME prefix only (a bpart run must not
          # delete apart parts and vice versa); --clobber refreshes the rest
          gh release view game-content --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -E "^${PREFIX}-" | while read -r a; do
              gh release delete-asset game-content "$a" --repo "$GITHUB_REPOSITORY" --yes || true
            done
          for z in parts/*.zip; do
            echo "uploading $z ($(du -m "$z" | cut -f1) MiB) ..."
            gh release upload game-content "$z" --repo "$GITHUB_REPOSITORY" --clobber
            echo "  done: $z"
          done
          echo "--- draft release assets now ---"
          gh release view game-content --repo "$GITHUB_REPOSITORY" \
            --jq '.assets[] | .name + "  " + ((.size / 1073741824 * 100 | round) / 100 | tostring) + "GB"'

      - name: Summary
        if: always()
        run: |
          echo "pack:     ${{ matrix.pack }}"
          echo "prefix:   ${PREFIX:-n/a}"
          echo "files:    $(find content -type f 2>/dev/null | wc -l)"
          echo "size:     $(du -sh content 2>/dev/null | cut -f1)"
          echo "dl.log tail:"; tail -c 4000 dd.log 2>/dev/null | tr '\r' '\n' | tail -15 || true
