name: fetch-csgo-content

# Downloads the CS:GO legacy (1.38.8.1) game content from Steam depots with
# DepotDownloader (anonymous — omit -username entirely; passing
# "-username anonymous" makes SteamKit throw LogOn ArgumentException),
# filters out what the port does not need (pak01_*.vpk data volumes, top-level
# bin/ client binaries), packs it into <=1.8GB zip parts and uploads them to
# the DRAFT release 'game-content'.  The normal CI boot-test then picks the
# pack up automatically (ci.yml "Fetch game content").
#
# DepotDownloader 2.7.x notes (learned the hard way, run 41296346328):
#   * branch flag is -beta (a -branch arg is silently IGNORED)
#   * anonymous = no -username at all
#   * -filelist lines are literal paths or "regex:..." patterns; the old "!"
#     exclusion syntax is GONE — exclusions are done with a negative lookahead
#
# Manual trigger only — re-runs replace the assets (--clobber).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-content
  cancel-in-progress: false

jobs:
  fetch:
    name: depot-download → pack → release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install DepotDownloader
        run: |
          curl -sfL --retry 3 -o dd.zip \
            https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_2.7.4/DepotDownloader-linux-x64.zip
          mkdir dd && unzip -q dd.zip -d dd && chmod +x dd/DepotDownloader

      # everything except top-level bin/ and any pak01*.vpk volume
      - name: Prepare filelist filter
        run: |
          printf 'regex:^(?!bin/)(?!.*pak01).*$\n' > filter.txt
          cat filter.txt

      # Attempt chain, first accessible depot wins.  Each candidate is probed
      # with -manifest-only first (seconds, no content) and the manifest must
      # look like legacy CS:GO (steam.inf + cstrike/ at the depot root).
      #   a1: app 730 depot 731 branch csgo_legacy — legacy CLIENT content
      #   a2: app 4465480 (standalone legacy client app) — all depots probed,
      #       the one containing cstrike/ is selected
      #   a3: app 740 depot 740 — legacy dedicated-server content (anonymous
      #       by design; same 1.38.8.1 content minus client-only extras)
      - name: Depot-download content (attempt chain)
        run: |
          mkdir -p out logs
          probe() {
            local tag="$1"; shift
            echo "=== manifest probe $tag: $* ==="
            timeout 240 ./dd/DepotDownloader -manifest-only -os windows \
              -dir "probe-$tag" "$@" > "logs/$tag-probe.log" 2>&1
            local rc=$?
            tail -3 "logs/$tag-probe.log" || true
            [ $rc -eq 0 ] || return 1
            M=$(ls "probe-$tag"/*.txt 2>/dev/null | head -1)
            [ -n "$M" ] || return 1
            grep -q "^steam.inf" "$M" || return 1
            grep -q "^cstrike/" "$M" || return 1
            echo "probe $tag: legacy-layout manifest OK ($M)"
          }
          full() {
            local tag="$1"; shift
            echo "=== full download $tag: $* ==="
            timeout 1200 ./dd/DepotDownloader -os windows \
              -filelist filter.txt -dir out "$@" 2>&1 | tee "logs/$tag-full.log" | tail -6
            SI=$(find out -name steam.inf | head -1)
            [ -n "$SI" ] || { echo "no steam.inf downloaded"; return 1; }
            PV=$(grep -oE 'PatchVersion=[0-9.]+' "$SI" | head -1 | cut -d= -f2)
            echo "steam.inf PatchVersion=$PV"
            [ "$PV" = "1.38.8.1" ]
          }

          if probe a1 -app 730 -depot 731 -beta csgo_legacy && full a1 -app 730 -depot 731 -beta csgo_legacy; then
            echo "OK via app 730 depot 731 csgo_legacy"; exit 0
          fi
          if probe a2 -app 4465480; then
            DD_DEPOT=$(ls probe-a2/*.txt | head -1 | xargs basename | grep -oE "^[0-9]+")
            echo "app 4465480 content depot id: $DD_DEPOT"
            if [ -n "$DD_DEPOT" ] && full a2 -app 4465480 -depot "$DD_DEPOT"; then
              echo "OK via app 4465480"; exit 0
            fi
          fi
          rm -rf out && mkdir -p out
          if probe a3 -app 740 -depot 740 && full a3 -app 740 -depot 740; then
            echo "OK via app 740 (server content)"; exit 0
          fi
          echo "::error::all depot attempts failed — inspect logs/*.log"
          exit 1

      - name: Inspect content tree
        run: |
          SI=$(find out -name steam.inf | head -1)
          echo "--- steam.inf ---"; cat "$SI" || true
          echo "--- top level ---"; ls -A out | head -30
          echo "--- sizes ---"; du -sm out/* 2>/dev/null | sort -nr | head -25
          echo "--- cstrike sample ---"; ls out/cstrike 2>/dev/null | head -30

      # Pack top-level entries into ~1.7GB zip parts (release asset cap = 2GB)
      - name: Pack parts
        run: |
          cd out
          mkdir -p parts
          mapfile -t ENTRIES < <(ls -A)
          i=1; CUR=(); CURSZ=0
          for e in "${ENTRIES[@]}"; do
            SZ=$(du -sm "$e" | cut -f1)
            CUR+=("$e"); CURSZ=$((CURSZ+SZ))
            if [ "$CURSZ" -ge 1700 ]; then
              echo "part $i: ${CUR[*]} (${CURSZ}MB)"
              zip -q -r -1 "parts/apack-$i.zip" "${CUR[@]}"
              i=$((i+1)); CUR=(); CURSZ=0
            fi
          done
          if [ "${#CUR[@]}" -gt 0 ]; then
            echo "part $i: ${CUR[*]} (${CURSZ}MB)"
            zip -q -r -1 "parts/apack-$i.zip" "${CUR[@]}"
          fi
          ls -la parts/

      - name: Upload pack to draft release game-content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view game-content --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create game-content --draft --title "game-content" \
              --notes "CS:GO legacy 1.38.8.1 content (A-pack: no pak01_*.vpk, no bin/)" --repo "$GITHUB_REPOSITORY"
          gh release upload game-content out/parts/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          gh release view game-content --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | "  \(.name)  \((.size / 1048576 | round))MB"'

      - name: Upload logs (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-content-logs
          path: |
            logs/
            filter.txt
          if-no-files-found: ignore
