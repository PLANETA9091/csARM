name: csARM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      opt_level:
        description: 'Optimization level (-O1 / -O2 / -Oz)'
        required: false
        default: '-O2'
      lto:
        description: 'ThinLTO (1 = enable)'
        required: false
        default: '1'
      strip:
        description: 'Strip debug info from .so (1 = enable)'
        required: false
        default: '0'

env:
  MIRROR: https://github.com/perilouswithadollarsign/cstrike15_src.git

jobs:
  # Job 1: build all module groups in parallel matrix
  build:
    name: build/${{ matrix.abi }}/${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            tag: core
            modules: "tier0/tier0.vpc tier1/tier1.vpc tier2/tier2.vpc vstdlib/vstdlib.vpc mathlib/mathlib.vpc appframework/appframework.vpc utils/bzip2/bzip2.vpc"
            defs: ""
          - abi: arm64-v8a
            tag: engine
            modules: "engine/engine.vpc videocfg/videocfg.vpc vgui2/matsys_controls/matsys_controls.vpc lists/cryptopp.txt lists/quickhull.txt"
            defs: ""
          - abi: arm64-v8a
            tag: render
            modules: "materialsystem/materialsystem.vpc materialsystem/shaderlib/shaderlib.vpc studiorender/studiorender.vpc vguimatsurface/vguimatsurface.vpc"
            defs: ""
          - abi: arm64-v8a
            tag: vgui
            modules: "vgui2/src/vgui_dll.vpc vgui2/vgui_controls/vgui_controls.vpc vgui2/vgui_surfacelib/vgui_surfacelib.vpc"
            defs: ""
          - abi: arm64-v8a
            tag: data
            modules: "datacache/datacache.vpc soundemittersystem/soundemittersystem.vpc filesystem/filesystem_stdio.vpc inputsystem/inputsystem.vpc lists/launcher.txt tier3/tier3.vpc dmxloader/dmxloader.vpc bitmap/bitmap.vpc vtf/vtf.vpc scenefilecache/scenefilecache.vpc interfaces/interfaces.vpc vpklib/vpklib.vpc bonesetup/bonesetup.vpc lists/choreo.txt lists/mathlib_extra.txt soundsystem/soundsystem.vpc soundsystem/lowlevel/soundsystem_lowlevel.vpc"
            defs: ""
          - abi: arm64-v8a
            tag: client
            modules: "game/client/client_cstrike15.vpc"
            defs: "DCLIENT_DLL=1 DCSTRIKE_CLIENT_DLL=1 DCSTRIKE_DLL=1 DCSTRIKE15=1 DGAMEUI_EMBEDDED=1 DGAMEUI_EXPORTS=1 DVERSION_SAFE_STEAM_API_INTERFACES=1 DUSE_ECONOMY_FEATURES=1"
          - abi: arm64-v8a
            tag: server
            modules: "game/server/server_cstrike15.vpc"
            defs: "DGAME_DLL=1 DCSTRIKE_DLL=1 DCSTRIKE15=1 DVERSION_SAFE_STEAM_API_INTERFACES=1 DPROTECTED_THINGS_ENABLE=1"
          - abi: arm64-v8a
            tag: pb25
            modules: "lists/protobuf25.txt"
            defs: "HAVE_PTHREAD=1"
          - abi: x86_64
            tag: core
            modules: "tier0/tier0.vpc tier1/tier1.vpc tier2/tier2.vpc vstdlib/vstdlib.vpc mathlib/mathlib.vpc appframework/appframework.vpc utils/bzip2/bzip2.vpc"
            defs: ""
          - abi: x86_64
            tag: engine
            modules: "engine/engine.vpc videocfg/videocfg.vpc vgui2/matsys_controls/matsys_controls.vpc lists/cryptopp.txt lists/quickhull.txt"
            defs: ""
          - abi: x86_64
            tag: render
            modules: "materialsystem/materialsystem.vpc materialsystem/shaderlib/shaderlib.vpc studiorender/studiorender.vpc vguimatsurface/vguimatsurface.vpc"
            defs: ""
          - abi: x86_64
            tag: vgui
            modules: "vgui2/src/vgui_dll.vpc vgui2/vgui_controls/vgui_controls.vpc vgui2/vgui_surfacelib/vgui_surfacelib.vpc"
            defs: ""
          - abi: x86_64
            tag: data
            modules: "datacache/datacache.vpc soundemittersystem/soundemittersystem.vpc filesystem/filesystem_stdio.vpc inputsystem/inputsystem.vpc lists/launcher.txt tier3/tier3.vpc dmxloader/dmxloader.vpc bitmap/bitmap.vpc vtf/vtf.vpc scenefilecache/scenefilecache.vpc interfaces/interfaces.vpc vpklib/vpklib.vpc bonesetup/bonesetup.vpc lists/choreo.txt lists/mathlib_extra.txt soundsystem/soundsystem.vpc soundsystem/lowlevel/soundsystem_lowlevel.vpc"
            defs: ""
          - abi: x86_64
            tag: client
            modules: "game/client/client_cstrike15.vpc"
            defs: "DCLIENT_DLL=1 DCSTRIKE_CLIENT_DLL=1 DCSTRIKE_DLL=1 DCSTRIKE15=1 DGAMEUI_EMBEDDED=1 DGAMEUI_EXPORTS=1 DVERSION_SAFE_STEAM_API_INTERFACES=1 DUSE_ECONOMY_FEATURES=1"
          - abi: x86_64
            tag: server
            modules: "game/server/server_cstrike15.vpc"
            defs: "DGAME_DLL=1 DCSTRIKE_DLL=1 DCSTRIKE15=1 DVERSION_SAFE_STEAM_API_INTERFACES=1 DPROTECTED_THINGS_ENABLE=1"
          - abi: x86_64
            tag: pb25
            modules: "lists/protobuf25.txt"
            defs: "HAVE_PTHREAD=1"

    steps:
      - uses: actions/checkout@v4

      - name: Cache source
        id: cache-src
        uses: actions/cache@v4
        with:
          path: c15
          key: cstrike15-src-v5

      - name: Fetch pristine source + apply patches (idempotent, always)
        run: ./build/setup_source.sh "$GITHUB_WORKSPACE"

      - name: Verify source
        run: |
          test -f c15/engine/engine.vpc || { echo "source incomplete"; exit 1; }
          echo "source files: $(find c15 -type f | wc -l)"

      - name: Cache host protoc
        uses: actions/cache@v4
        with:
          path: .cache/protoc25
          key: protoc25-linux

      - name: Generate protobuf messages (genproto)
        run: bash build/setup_proto.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.cache"

      - name: Setup NDK
        run: |
          if [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "NDKROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          else
            curl -sL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
            unzip -q /tmp/ndk.zip -d $HOME
            echo "NDKROOT=$HOME/android-ndk-r27d" >> $GITHUB_ENV
          fi

      - name: Build modules
        run: |
          set -u
          export PATH="$NDKROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export R=$GITHUB_WORKSPACE
          if [ "${{ matrix.abi }}" = "x86_64" ]; then export CC=x86_64-linux-android24-clang; else export CC=aarch64-linux-android24-clang; fi
          export OPT=${{ github.event.inputs.opt_level || '-O2' }}
          export LTO=${{ github.event.inputs.lto || '1' }}
          export JOBS=4
          if [ "${{ matrix.tag }}" = "vgui" ]; then
            bash build/setup_freetype.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.cache"
          fi
          for m in ${{ matrix.modules }}; do
            echo "=== MODULE $m ==="
            # crypto++ 5.61 predates C++17 (std::byte clash, std::auto_ptr)
            case "$m" in
              *cryptopp*) export CXXSTD=gnu++11 ;;
              *)          unset CXXSTD ;;
            esac
            DEFX="${{ matrix.defs }}" bash build/trybuild.sh "$m" || true
          done

      - name: Build summary
        run: |
          total_ok=0; total_fail=0; zero=0
          echo "| module | ok | fail |" > summary.md
          echo "|--------|----|------|" >> summary.md
          for d in obj/*/; do
            t=$(basename "$d"); ok=$(ls "$d" 2>/dev/null | wc -l)
            fail=0
            for f in err/$t/*.log; do [ -f "$f" ] && grep -qE 'error:' "$f" && fail=$((fail+1)); done
            echo "| $t | $ok | $fail |" >> summary.md
            total_ok=$((total_ok+ok)); total_fail=$((total_fail+fail))
            if [ "$ok" -eq 0 ]; then echo "::error::module $t produced 0 objects"; zero=$((zero+1)); fi
          done
          echo "TOTAL ok=$total_ok fail=$total_fail" >> summary.md
          cat summary.md
          if [ "$total_fail" -gt 0 ] || [ "$zero" -gt 0 ]; then exit 1; fi

      - name: Collect error logs
        if: always()
        run: |
          mkdir -p logs
          find err -name "*.log" -size +0c | xargs -I{} sh -c 'grep -qE "error:" "{}" && cp {} logs/$(echo {} | tr "/" "_")' 2>/dev/null || true
          cp summary.md logs/ 2>/dev/null || true
          tar czf logs.tgz logs/ lists/ 2>/dev/null || true

      - name: Upload error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.abi }}-${{ matrix.tag }}
          path: logs.tgz
          if-no-files-found: ignore

      - name: Upload object files
        uses: actions/upload-artifact@v4
        with:
          name: obj-${{ matrix.abi }}-${{ matrix.tag }}
          path: obj/
          retention-days: 3
          compression-level: 6

  # Job 2: link all modules into shared libraries
  link:
    name: link/.so/${{ matrix.abi }}
    needs: build
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a, x86_64 ]
    steps:
      - uses: actions/checkout@v4

      - name: Cache source
        id: cache-src-link
        uses: actions/cache@v4
        with:
          path: c15
          key: cstrike15-src-v5

      - name: Fetch source + patches (needed for genproto compile and SDL2 headers)
        run: ./build/setup_source.sh "$GITHUB_WORKSPACE"

      - name: Download all objects
        uses: actions/download-artifact@v4
        with:
          pattern: obj-${{ matrix.abi }}-*
          path: obj/

      - name: Flatten artifact dirs
        run: |
          mkdir -p obj_flat
          for d in obj/obj-*/; do
            for t in "$d"*/; do
              tag=$(basename "$t")
              mkdir -p "obj_flat/$tag"
              cp -r "$t"* "obj_flat/$tag/" 2>/dev/null || true
            done
          done
          rm -rf obj && mv obj_flat obj
          echo "Object groups:"; ls obj/

      - name: Setup NDK
        run: |
          if [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "NDKROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          else
            curl -sL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
            unzip -q /tmp/ndk.zip -d $HOME
            echo "NDKROOT=$HOME/android-ndk-r27d" >> $GITHUB_ENV
          fi

      - name: Build SDL2 static lib
        run: |
          if [ "${{ matrix.abi }}" = "x86_64" ]; then
            export CC=x86_64-linux-android24-clang
          else
            export CC=aarch64-linux-android24-clang
          fi
          bash build/setup_sdl2.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.cache"

      - name: Build FreeType (font stack)
        run: |
          if [ "${{ matrix.abi }}" = "x86_64" ]; then
            export CC=x86_64-linux-android24-clang
          else
            export CC=aarch64-linux-android24-clang
          fi
          bash build/setup_freetype.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.cache"

      - name: Link shared libraries
        run: |
          export PATH="$NDKROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          if [ "${{ matrix.abi }}" = "x86_64" ]; then export CC=x86_64-linux-android27-clang; else export CC=aarch64-linux-android27-clang; fi
          export LTO=${{ github.event.inputs.lto || '1' }}
          export STRIP=${{ github.event.inputs.strip || '0' }}
          mkdir -p out
          bash build/link.sh
          # native launcher (libmain.so) — needs libSDL2.so + libtier0.so from out/
          bash build/build_main.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.cache"
          ls -la out/

      - name: Undefined symbol report
        if: always()
        run: |
          READELF="$NDKROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for so in out/*.so; do
            [ -e "$so" ] || continue
            echo "=== $so ==="
            $READELF --dyn-syms "$so" | grep -c UND || true
          done

      - name: Verify libraries
        if: always()
        run: |
          for so in out/*.so; do
            [ -e "$so" ] || continue
            echo "=== $so ==="
            file "$so"
            $NDKROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d "$so" | head -12
          done

      - name: Upload libraries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: so-libs-${{ matrix.abi }}
          path: out/*.so
          if-no-files-found: ignore

      - name: Upload link log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-log
          path: link.log
          if-no-files-found: ignore

      - name: Upload unresolved symbol report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unresolved-${{ matrix.abi }}
          path: |
            out/.unresolved
            out/.unresolved_warn
          if-no-files-found: ignore

  # Job 2a: build SwiftShader (software GL). Bundling libEGL.so/libGLESv2.so
  # into the APK makes the engine render with ZERO GPU: the app's
  # nativeLibraryDir is searched before /system/lib64, so these shadow the
  # system driver for the whole process (engine + SDL2 both go through it).
  swiftshader:
    name: swiftshader/${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Subzero has no AArch64 backend -> x86_64 uses it (fast build),
          # arm64 uses the vendored trimmed LLVM-10 (Chrome's own ARM64 path)
          - abi: x86_64
            backend: Subzero
          - abi: arm64-v8a
            backend: LLVM
    steps:
      - name: Clone SwiftShader at known-good Android-capable revision
        run: |
          # main() dropped standalone-CMake Android support (Vulkan block is
          # unconditional and matches no Android platform branch).  02a91c9c
          # (2021-08-20) still has SWIFTSHADER_BUILD_EGL/GLESv2 options, the
          # Android branch, and marl/astc-encoder/subzero/SPIRV checked
          # IN-TREE -> no submodules needed for an ES-only build.
          git init -q swiftshader && cd swiftshader
          git remote add origin https://github.com/google/swiftshader.git
          git fetch -q --depth 1 origin 02a91c9cc44530c813dae89e490fe33828353636
          git checkout -q FETCH_HEAD
          git rev-parse HEAD | tee ../swiftshader_commit.txt
          # ES-only build still needs marl (Reactor includes marl/event.h) but
          # at this revision marl is gated on the Vulkan build -> force it on
          sed -i 's/set(BUILD_MARL ${SWIFTSHADER_BUILD_VULKAN})/set(BUILD_MARL TRUE)/' CMakeLists.txt
          # NDK-standalone fixes: platform-only headers are not in the NDK.
          # - FrameBufferAndroid.hpp needs cutils/native_handle.h only for the
          #   non-NDK gralloc member (dead code under ANDROID_NDK_BUILD)
          # - cutils/log.h is platform-only; NDK ships log/log.h (liblog)
          sed -i 's|#include <cutils/native_handle.h>||' src/Main/FrameBufferAndroid.hpp
          sed -i 's|buffer_handle_t bufferImportedHandle;|int bufferImportedHandle;|' src/Main/FrameBufferAndroid.hpp
          sed -i 's|#include <cutils/log.h>|#include <log/log.h>|' src/Common/DebugAndroid.hpp src/OpenGL/common/debug.cpp
          grep -n "set(BUILD_MARL" CMakeLists.txt || true

      - name: Setup NDK (r27d — clang-21 of NDK 30 chokes on vendored LLVM-10)
        run: |
          R27=$(ls -d "$ANDROID_HOME"/ndk/27* 2>/dev/null | head -1 || true)
          if [ -n "$R27" ]; then
            echo "NDKROOT=$R27" >> $GITHUB_ENV
            echo "using runner-shipped NDK $R27"
          else
            curl -sL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
            unzip -q /tmp/ndk.zip -d $HOME
            echo "NDKROOT=$HOME/android-ndk-r27d" >> $GITHUB_ENV
          fi

      - name: Configure + build (ES/EGL only)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
          cmake -S swiftshader -B out -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDKROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DREACTOR_BACKEND=${{ matrix.backend }} \
            -DLLVM_SUBZERO_PLATFORM_INCLUDE_DIR=build/Android/include \
            -DCMAKE_SHARED_LINKER_FLAGS="-landroid -llog" \
            -DSWIFTSHADER_BUILD_VULKAN=OFF \
            -DSWIFTSHADER_BUILD_EGL=ON \
            -DSWIFTSHADER_BUILD_GLESv2=ON \
            -DSWIFTSHADER_BUILD_PVR=OFF \
            -DSWIFTSHADER_BUILD_TESTS=OFF \
            -DSWIFTSHADER_BUILD_BENCHMARKS=OFF \
            -DSWIFTSHADER_WARNINGS_AS_ERRORS=OFF
          cmake --build out --parallel $(nproc)

      - name: Collect libs (rename to shadow system EGL/GLES)
        run: |
          mkdir -p bundle/${{ matrix.abi }}
          find out -name "*.so" -exec cp {} bundle/${{ matrix.abi }}/ \; 2>/dev/null || true
          cd bundle/${{ matrix.abi }}
          for f in libEGL*.so; do [ "$f" = "libEGL.so" ] || mv -f "$f" libEGL.so || true; done
          for f in libGLESv2*.so; do [ "$f" = "libGLESv2.so" ] || mv -f "$f" libGLESv2.so || true; done
          for f in libGLESv1_CM*.so libGLES_CM*.so; do [ "$f" = "libGLESv1_CM.so" ] || mv -f "$f" libGLESv1_CM.so || true; done
          ls -la
          { [ -f libEGL.so ] && [ -f libGLESv2.so ]; } || { echo "::error::EGL/GLES libs missing"; find out -name "*.so"; exit 1; }
          # sanity: correct arch
          file libEGL.so | tee /dev/stderr | grep -q aarch64 && echo "arch arm64 OK" || true
          file libEGL.so | grep -q "x86-64" && echo "arch x86_64 OK" || true

      - name: Upload SwiftShader libs
        uses: actions/upload-artifact@v4
        with:
          name: swiftshader-${{ matrix.abi }}
          path: bundle/${{ matrix.abi }}/*.so
          retention-days: 7

  # Job 2b: FULL ENGINE BOOT TEST — custom fast emulator runner.
  # Replaces: (a) the old macos-14 arm64 job that always exploded with
  # "HVF error: HV_UNSUPPORTED" (GitHub macOS runners have no nested virt)
  # and burned a 20-min timeout every run; (b) the TCG -no-accel ubuntu job
  # that needed 30-45 min just to reach sys.boot_completed.
  # This one: GitHub ubuntu x86_64 runners DO expose /dev/kvm (their arm64
  # runners do NOT, checked 2026-10) -> the x86_64 emulator boots under KVM
  # in ~60-90s on a LIGHT AOSP ATD image (Automated Test Device, no Google
  # APIs, ~2x faster boot than google_apis). The x86_64 APK (native code, no
  # translation) exercises the REAL boot path: CSARMActivity -> libmain ->
  # LauncherMain -> CSourceAppSystemGroup -> IEngineAPI::Run() with pure
  # software rendering (swiftshader_indirect + bundled SwiftShader variant).
  # The arm64 target is covered by tests/qemu-aarch64 + arm64 APK artifacts.
  boot-test:
    name: boot/emulator-fast
    needs: [ link, swiftshader ]
    if: ${{ always() && !cancelled() && needs.link.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download .so libraries (both ABIs)
        uses: actions/download-artifact@v4
        with:
          pattern: so-libs-*
          path: android/libs

      - name: Flatten lib dirs
        run: |
          for d in android/libs/so-libs-*/; do
            [ -d "$d" ] || continue
            abi=$(basename "$d" | sed 's/^so-libs-//')
            mkdir -p "android/libs/$abi"
            mv "$d"* "android/libs/$abi/" 2>/dev/null || true
          done
          rm -rf android/libs/so-libs-*
          echo "--- native libs per ABI ---"
          for a in x86_64 arm64-v8a; do echo "$a: $(ls android/libs/$a/*.so 2>/dev/null | wc -l)"; done
          [ "$(ls android/libs/x86_64/*.so 2>/dev/null | wc -l)" -ge 21 ] || { echo "::error::missing x86_64 libs"; exit 1; }

      - name: Download SwiftShader libs
        if: needs.swiftshader.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: swiftshader-*
          path: android/libs-swiftshader

      - name: Flatten SwiftShader dirs
        if: needs.swiftshader.result == 'success'
        run: |
          for d in android/libs-swiftshader/swiftshader-*/; do
            [ -d "$d" ] || continue
            abi=$(basename "$d" | sed 's/^swiftshader-//')
            mkdir -p "android/libs-swiftshader/$abi"
            mv "$d"* "android/libs-swiftshader/$abi/" 2>/dev/null || true
          done
          rm -rf android/libs-swiftshader/swiftshader-*
          for a in x86_64 arm64-v8a; do
            echo "swiftshader $a: $(ls android/libs-swiftshader/$a/*.so 2>/dev/null | wc -l) so"
            [ -f android/libs-swiftshader/$a/libEGL.so ] || echo "::warning::no bundled libEGL.so for $a"
          done

      - name: Build APKs (system EGL, both ABIs)
        run: |
          mkdir -p android/out
          CSARM_OUT=$PWD/android/b-x86_64 bash android/build_apk.sh x86_64
          mv android/b-x86_64/csARM.apk android/out/csARM-x86_64.apk
          CSARM_OUT=$PWD/android/b-arm64 bash android/build_apk.sh arm64-v8a
          mv android/b-arm64/csARM.apk android/out/csARM-arm64.apk
          ls -la android/out/
          [ -f android/out/csARM-x86_64.apk ] && [ -f android/out/csARM-arm64.apk ]

      - name: Build SwiftShader APKs (bundled software GL)
        if: needs.swiftshader.result == 'success'
        run: |
          CSARM_OUT=$PWD/android/b-x86_64 bash android/build_apk.sh x86_64 swiftshader
          mv android/b-x86_64/csARM.apk android/out/csARM-x86_64-sw.apk
          CSARM_OUT=$PWD/android/b-arm64 bash android/build_apk.sh arm64-v8a swiftshader
          mv android/b-arm64/csARM.apk android/out/csARM-arm64-sw.apk
          unzip -l android/out/csARM-x86_64-sw.apk | grep -E "libEGL|libGLESv2" || { echo "::error::swiftshader libs not in APK"; exit 1; }
          ls -la android/out/
          [ -f android/out/csARM-x86_64-sw.apk ] && [ -f android/out/csARM-arm64-sw.apk ]

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csARM-apks
          path: android/out/*.apk
          retention-days: 7

      - name: Enable KVM (GitHub ubuntu runners have nested virt)
        run: |
          ls -l /dev/kvm || echo "::warning::/dev/kvm missing"
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules 2>/dev/null || true
          sudo udevadm trigger --name-match=kvm 2>/dev/null || true
          if [ -w /dev/kvm ]; then
            echo "KVM: /dev/kvm writable -> hardware acceleration ON"
            echo "KVMOK=1" >> "$GITHUB_ENV"
          else
            echo "::warning::no writable /dev/kvm -> TCG fallback (slow but works)"
            echo "KVMOK=0" >> "$GITHUB_ENV"
          fi

      - name: Cache emulator system image + AVD
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/system-images
            ~/.android/avd
          key: emu-img-android30-aosp-atd-x86_64-v1

      - name: Install system image (AOSP ATD, no Google APIs) + pick emulator (KVM vs pinned TCG)
        run: |
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          # Lightweight image WITHOUT Google APIs: aosp_atd (Automated Test
          # Device) boots ~2x faster than google_apis and has no GMS bloat.
          # Fall back to default -> google_apis only if ATD is unavailable.
          IMG=""
          LIST=$("$SDK/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null | grep "system-images;android-3" || true)
          for c in "system-images;android-30;aosp_atd;x86_64" "system-images;android-30;default;x86_64" "system-images;android-30;google_apis;x86_64"; do
            if echo "$LIST" | grep -qF "$c"; then IMG=$c; break; fi
          done
          [ -n "$IMG" ] || { echo "::error::no candidate system image found"; echo "$LIST" | head -15; exit 1; }
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          echo "system image: $IMG"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "$IMG" > /dev/null
          # x11/pulse libs the qemu binary dlopens; runner images dropped them
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libasound2 libnss3 libgl1 libxkbcommon0 libdbus-1-3 fontconfig 2>/dev/null \
            || sudo apt-get install -y -qq libpulse0 libasound2t64 libnss3 libgl1 libxkbcommon0 libdbus-1-3 fontconfig || true
          if [ "${KVMOK:-0}" = "1" ] && "$SDK/emulator/emulator" -accel check > accel.log 2>&1; then
            echo "EMU_BIN=$SDK/emulator/emulator" >> "$GITHUB_ENV"
            cat accel.log
            echo "emulator: preinstalled 37.x under KVM"
          else
            echo "--- accel check output (why fallback engaged) ---"; cat accel.log 2>/dev/null || true
            # 37.x hangs silently under TCG (-no-accel) -> pin 34.1.20 (11525734)
            curl -sfL --retry 3 -o /tmp/emu.zip https://dl.google.com/android/repository/emulator-linux_x64-11525734.zip
            rm -rf "$SDK/emu34" && unzip -q /tmp/emu.zip -d "$SDK/emu34"
            chmod +x "$SDK/emu34/emulator/emulator" || true
            echo "EMU_BIN=$SDK/emu34/emulator/emulator" >> "$GITHUB_ENV"
            echo "emulator: pinned 34.1.20 (TCG fallback)"
            ldd "$SDK/emu34/emulator/qemu/linux-x86_64/qemu-system-x86_64" | grep "not found" || echo "qemu deps: none missing"
          fi

      - name: Launch emulator (no-window / no-audio / no-boot-anim / swiftshader_indirect / accel on)
        run: |
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n test -k "$IMG" -d pixel_4 --force
          test -f "$ANDROID_AVD_HOME/test.ini" || { echo "::error::AVD test.ini missing"; ls -la "$ANDROID_AVD_HOME"; exit 1; }
          ACCEL=on; [ "${KVMOK:-0}" != "1" ] && ACCEL=off
          nohup env ANDROID_AVD_HOME="$ANDROID_AVD_HOME" "$EMU_BIN" -avd test \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel $ACCEL -memory 4096 -cores 4 -port 5554 > emulator.log 2>&1 &
          echo $! > emu.pid
          sleep 5
          head -30 emulator.log || true
          kill -0 "$(cat emu.pid)" 2>/dev/null || { echo "::error::emulator died at launch"; tail -40 emulator.log; exit 1; }

      - name: Wait for Android boot (2s poll, fail-fast on death)
        run: |
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          ADB=$SDK/platform-tools/adb
          "$ADB" start-server || true
          LIMIT=600; [ "${KVMOK:-0}" != "1" ] && LIMIT=1800
          BOOTED=0
          while [ $SECONDS -lt $LIMIT ]; do
            B=$(timeout 10 "$ADB" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n' || true)
            [ "$B" = "1" ] && { BOOTED=1; echo "Android BOOTED after ${SECONDS}s"; break; }
            kill -0 "$(cat emu.pid)" 2>/dev/null || { echo "::error::emulator process died while booting"; tail -50 emulator.log; break; }
            sleep 2
          done
          if [ "$BOOTED" != "1" ]; then
            echo "::error::emulator did not reach sys.boot_completed in ${LIMIT}s"
            tail -30 emulator.log || true
            exit 1
          fi

      - name: Engine boot test (x86_64 native, software rendering)
        run: |
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          ADB=$SDK/platform-tools/adb
          sleep 12   # window manager settle
          # background logcat: continuous parallel capture for ALL phases
          "$ADB" -s emulator-5554 logcat -v time > logcat_stream.txt 2>&1 &
          echo $! > logcat.pid
          OK=0
          for i in 1 2 3 4 5; do
            "$ADB" -s emulator-5554 install -r -t android/out/csARM-x86_64.apk && { OK=1; break; }
            echo "install retry $i"; sleep 8
          done
          [ "$OK" = "1" ] || { echo "::error::APK install failed"; "$ADB" -s emulator-5554 logcat -d > logcat_boot.txt || true; exit 1; }
          "$ADB" -s emulator-5554 shell settings put global window_animation_scale 0 || true
          # --- part 1: dlopen smoke test (MainActivity) ---
          "$ADB" -s emulator-5554 shell am start -n com.csarm.port/.MainActivity || true
          sleep 8
          "$ADB" -s emulator-5554 exec-out screencap -p > shot1.png || true
          sleep 4
          "$ADB" -s emulator-5554 exec-out screencap -p > shot2.png || true
          "$ADB" -s emulator-5554 logcat -d > logcat.txt || true
          grep -E "CSARM_LIB_OK|CSARM_LIB_FAIL|CSARM_LOAD_DONE" logcat.txt | sort -u || true
          # --- part 2: FULL ENGINE BOOT (CSARMActivity -> libmain -> LauncherMain) ---
          "$ADB" -s emulator-5554 logcat -c || true
          "$ADB" -s emulator-5554 shell am start -n com.csarm.port/.CSARMActivity || true
          LIMIT=600
          while [ $SECONDS -lt $LIMIT ]; do
            "$ADB" -s emulator-5554 logcat -d > logcat_boot.txt 2>/dev/null || true
            grep -qE "CSARM_MAIN_EXIT|CSARM_ENGINE_TICK|CSARM_MAIN_FAIL" logcat_boot.txt && break
            kill -0 "$(cat emu.pid)" 2>/dev/null || { echo "::error::emulator died during engine test"; break; }
            sleep 5
          done
          sleep 6
          "$ADB" -s emulator-5554 exec-out screencap -p > boot1.png || true
          sleep 6
          "$ADB" -s emulator-5554 exec-out screencap -p > boot2.png || true
          "$ADB" -s emulator-5554 logcat -d > logcat_boot.txt || true
          "$ADB" -s emulator-5554 logcat -d -b crash > crash.txt || true
          echo "=== csARM boot chain ==="
          grep -E "CSARM_" logcat_boot.txt | head -80 || true
          echo "=== engine spew sample ==="
          grep "CSARM_ENG" logcat_boot.txt | head -60 || true
          echo "=== AndroidRuntime crashes ==="
          grep -B2 -A8 "AndroidRuntime" logcat_boot.txt | head -50 || true

      - name: Arm64 APK boot via ARM translation (opportunistic)
        continue-on-error: true
        run: |
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          ADB=$SDK/platform-tools/adb
          "$ADB" -s emulator-5554 install -r -t android/out/csARM-arm64.apk || { echo "arm64 install failed (no ARM translation on this image)"; exit 0; }
          "$ADB" -s emulator-5554 logcat -c || true
          "$ADB" -s emulator-5554 shell am start -n com.csarm.port/.MainActivity || true
          sleep 12
          "$ADB" -s emulator-5554 logcat -d > logcat_arm64_load.txt || true
          grep -E "CSARM_LIB_OK|CSARM_LIB_FAIL|CSARM_LOAD_DONE" logcat_arm64_load.txt | sort -u || true
          "$ADB" -s emulator-5554 logcat -c || true
          "$ADB" -s emulator-5554 shell am start -n com.csarm.port/.CSARMActivity || true
          LIMIT=240
          while [ $SECONDS -lt $LIMIT ]; do
            "$ADB" -s emulator-5554 logcat -d > logcat_arm64.txt 2>/dev/null || true
            grep -qE "CSARM_LAUNCHER_CALL|CSARM_MAIN_FAIL|CSARM_MAIN_EXIT" logcat_arm64.txt && break
            sleep 5
          done
          "$ADB" -s emulator-5554 exec-out screencap -p > arm64.png || true
          grep -E "CSARM_" logcat_arm64.txt | head -40 || true

      - name: Engine boot with BUNDLED SwiftShader (x86_64, zero GPU)
        if: needs.swiftshader.result == 'success'
        run: |
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          ADB=$SDK/platform-tools/adb
          "$ADB" -s emulator-5554 install -r -t android/out/csARM-x86_64-sw.apk || { echo "::error::sw APK install failed"; exit 1; }
          "$ADB" -s emulator-5554 logcat -c || true
          "$ADB" -s emulator-5554 shell am start -n com.csarm.port/.CSARMActivity || true
          LIMIT=600
          while [ $SECONDS -lt $LIMIT ]; do
            "$ADB" -s emulator-5554 logcat -d > logcat_sw.txt 2>/dev/null || true
            grep -qE "CSARM_MAIN_EXIT|CSARM_ENGINE_TICK|CSARM_MAIN_FAIL" logcat_sw.txt && break
            kill -0 "$(cat emu.pid)" 2>/dev/null || { echo "::error::emulator died during sw test"; break; }
            sleep 5
          done
          sleep 6
          "$ADB" -s emulator-5554 exec-out screencap -p > sw1.png || true
          sleep 6
          "$ADB" -s emulator-5554 exec-out screencap -p > sw2.png || true
          "$ADB" -s emulator-5554 logcat -d > logcat_sw.txt || true
          "$ADB" -s emulator-5554 logcat -d -b crash > crash_sw.txt || true
          echo "=== SwiftShader boot chain ==="
          grep -E "CSARM_EGL|CSARM_" logcat_sw.txt | head -80 || true
          grep "CSARM_ENG" logcat_sw.txt | head -40 || true

      - name: Assert SwiftShader engine boot
        if: always() && needs.swiftshader.result == 'success'
        run: |
          [ -f logcat_sw.txt ] || { echo "::error::no swiftshader boot log"; exit 1; }
          L=logcat_sw.txt; fail=0
          grep -q "CSARM_EGL bundled" $L || { echo "::error::bundled SwiftShader libEGL.so was NOT used"; fail=1; }
          grep -q "CSARM_LAUNCHER_CALL" $L || { echo "::error::LauncherMain never called (sw path)"; fail=1; }
          if grep -q "CSARM_MAIN_FAIL" $L; then
            echo "::error::launcher failed under SwiftShader: $(grep CSARM_MAIN_FAIL $L | head -2)"; fail=1
          fi
          if [ "$fail" = "1" ]; then echo "--- tail ---"; tail -80 $L; exit 1; fi
          if grep -qE "CSARM_ENGINE_TICK|CSARM_ENGINE_FIRST_FRAME" $L; then
            echo "SWIFTSHADER RENDERING CONFIRMED (bundled software GL, zero GPU)"
          else
            echo "::warning::no engine ticks under SwiftShader yet (inspect artifacts)"
          fi

      - name: Assert library load (x86_64)
        if: always()
        run: |
          [ -f logcat.txt ] || { echo "::warning::no logcat.txt (emulator never booted)"; exit 0; }
          grep -q "CSARM_LOAD_DONE" logcat.txt || { echo "::error::load report missing"; tail -40 logcat.txt; exit 1; }
          if grep -q "CSARM_LIB_FAIL" logcat.txt; then
            echo "::error::libraries failed to load"; grep "CSARM_LIB_FAIL" logcat.txt; exit 1
          fi
          echo "All libraries dlopen OK"

      - name: Assert engine boot (full port)
        if: always()
        run: |
          [ -f logcat_boot.txt ] || { echo "::error::no boot log"; exit 1; }
          L=logcat_boot.txt; fail=0
          grep -q "CSARM_NATIVE_INIT" $L   || { echo "::error::native init not reached"; fail=1; }
          grep -q "CSARM_ARGS " $L         || { echo "::error::argv not built"; fail=1; }
          grep -q "CSARM_BIN_LINKS" $L     || { echo "::error::bin symlinks not created"; fail=1; }
          grep -q "CSARM_LAUNCHER_CALL" $L || { echo "::error::LauncherMain was never called"; fail=1; }
          if [ "$fail" = "1" ]; then echo "--- tail ---"; tail -80 $L; exit 1; fi
          echo "LauncherMain reached: Valve CSourceAppSystemGroup host is live"
          if grep -q "CSARM_MAIN_FAIL" $L; then
            echo "::error::launcher failed: $(grep CSARM_MAIN_FAIL $L | head -2)"; exit 1
          fi
          if grep -qE "CSARM_ENGINE_TICK|CSARM_ENGINE_FIRST_FRAME" $L; then
            echo "ENGINE FRAME LOOP CONFIRMED (software rendering, no GPU)"
          else
            echo "::warning::no engine ticks yet (engine may wait on content/UI; inspect artifacts)"
          fi
          PRE=$(grep -oE "CSARM_LAUNCHER_CALL pre_ms=[0-9]+" $L | grep -oE "[0-9]+$" | head -1)
          if [ -n "$PRE" ]; then
            echo "BOOT_TO_LAUNCHER_MS=$PRE"
            [ "$PRE" -le 60000 ] || { echo "::error::slow boot ${PRE}ms (>60s budget)"; exit 1; }
          fi
          grep -q "CSARM_MAIN_EXIT" $L && echo "launcher exit: $(grep CSARM_MAIN_EXIT $L | head -1)" || true
          kill "$(cat logcat.pid 2>/dev/null)" 2>/dev/null || true

      - name: Upload boot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test
          path: |
            shot*.png
            boot*.png
            arm64*.png
            sw*.png
            logcat.txt
            logcat_boot.txt
            logcat_arm64*.txt
            logcat_sw.txt
            logcat_stream.txt
            crash.txt
            crash_sw.txt
            emulator.log
          if-no-files-found: ignore

  # Job 3: aarch64 math/unit tests under qemu (validates NEON math patches)
  tests:
    name: tests/qemu-aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache source
        id: cache-src-tests
        uses: actions/cache@v4
        with:
          path: c15
          key: cstrike15-src-v5

      - name: Fetch/refresh source (idempotent)
        run: ./build/setup_source.sh "$GITHUB_WORKSPACE"

      - name: Install cross tools + qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user

      - name: Build and run aarch64 unit tests
        run: |
          set -e
          mkdir -p tests/out
          SRCS=$(cat lists/mathlib.txt | sed "s|^mathlib/|c15/mathlib/|" | grep -vE "expressioncalculator|lightdesc|polyhedron|IceKey" | tr "\n" " ")
          aarch64-linux-gnu-g++ -O2 -std=gnu++17 -w -Wno-narrowing \
            -DPOSIX=1 -DLINUX=1 -D_LINUX=1 -DGNUC=1 -DLINUX64 -DPLATFORM_64BITS=1 -DCOMPILER_GCC=1 -D_RAD_TELEMETRY_DISABLED \
            -I c15/public -I c15/public/tier0 -I c15/public/tier1 -I c15/public/mathlib -I c15/mathlib \
            -I c15/public/vstdlib -I c15/vstdlib \
            -I c15/thirdparty/telemetry/include -I c15/tier0 -I c15/thirdparty -I c15/thirdparty/sse2neon \
            tests/test_math.cpp tests/test_stubs.cpp \
            c15/tier0/cpu.cpp c15/tier0/cpu_posix.cpp c15/tier0/tier0_strtools.cpp c15/tier1/processor_detect_linux.cpp \
            c15/tier1/convar.cpp c15/tier1/characterset.cpp c15/tier1/utlstring.cpp c15/tier1/utlbuffer.cpp \
            $SRCS \
            -o tests/out/test_math -lm 2> tests/build.log || { tail -30 tests/build.log; exit 1; }
          qemu-aarch64 -L /usr/aarch64-linux-gnu tests/out/test_math

      - name: Build and run aarch64 VISUAL render test (software raster -> PNG)
        run: |
          set -e
          SRCS=$(cat lists/mathlib.txt | sed "s|^mathlib/|c15/mathlib/|" | grep -vE "expressioncalculator|lightdesc|polyhedron|IceKey" | tr "\n" " ")
          aarch64-linux-gnu-g++ -O2 -std=gnu++17 -w -Wno-narrowing \
            -DPOSIX=1 -DLINUX=1 -D_LINUX=1 -DGNUC=1 -DLINUX64 -DPLATFORM_64BITS=1 -DCOMPILER_GCC=1 -D_RAD_TELEMETRY_DISABLED \
            -I c15/public -I c15/public/tier0 -I c15/public/tier1 -I c15/public/mathlib -I c15/mathlib \
            -I c15/public/vstdlib -I c15/vstdlib \
            -I c15/thirdparty/telemetry/include -I c15/tier0 -I c15/thirdparty -I c15/thirdparty/sse2neon \
            tests/test_render.cpp tests/test_stubs.cpp \
            c15/tier0/cpu.cpp c15/tier0/cpu_posix.cpp c15/tier0/tier0_strtools.cpp c15/tier1/processor_detect_linux.cpp \
            c15/tier1/convar.cpp c15/tier1/characterset.cpp c15/tier1/utlstring.cpp c15/tier1/utlbuffer.cpp \
            $SRCS \
            -o tests/out/test_render -lm 2> tests/build_render.log || { tail -30 tests/build_render.log; exit 1; }
          qemu-aarch64 -L /usr/aarch64-linux-gnu tests/out/test_render
          # validate the rendered PNG: signature, IEND, plausible size
          python3 - <<'PY'
          d = open('tests/out/frame.png','rb').read()
          assert d[:8] == bytes([137,80,78,71,13,10,26,10]), 'bad PNG magic'
          assert d[-8:-4] == b'IEND', 'missing IEND'
          assert len(d) > 20000, f'PNG too small: {len(d)}'
          print(f'frame.png OK: {len(d)//1024} KB')
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/
