// csARM — fast boot + multithreaded engine (acceleration without quality loss)
host_thread_mode 2
mat_queue_mode 2
cl_threaded_bone_setup 1
cl_showhelp 0
gameui_xbox 0
engine_no_focus_sleep 0
snd_mixahead 0.1
r_eyemove 0
// console accessible for diagnostics
console 1

// ---------------------------------------------------------------------------
// csARM mobile defaults (Android/ARM64, GPU-bound on real phones)
// Kept deliberately conservative: everything here is either free on the CPU
// side or removes post-processing passes that the port cannot afford.
// ---------------------------------------------------------------------------

// threading: material system + bone setup on worker threads (already in the
// launcher defaults, repeated here so a staged depot cannot drop them)
mat_queue_mode 2
host_thread_mode 2
cl_threaded_bone_setup 1

// no post-processing stack: engine_post / bloom / motion blur are full-screen
// passes that cost more than the map itself on tiled mobile GPUs
mat_postprocess_enable 0
mat_hdr_level 0
mat_motion_blur_enabled 0
mat_software_aa_strength 0
mat_antialias 0
r_drawtracers_firstperson 1

// texture budget: mip bias + smaller texture limit keeps bandwidth sane
mat_picmip 2
r_lod 1
r_rootlod 1

// cheap shadows/decals (phone GPUs hate large dynamic shadow maps)
r_shadows 0
r_drawmodeldecals 1

// frame pacing: uncapped + no vsync while measuring; the launcher sets the
// window size, so keep the engine from rendering the UI at device resolution
fps_max 0
mat_vsync 0

// sound: skip the costly mixing path when no headset is attached
snd_mixahead 0.15
